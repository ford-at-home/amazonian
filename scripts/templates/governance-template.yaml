# governance.yaml — Amazonian Governance Manifest
#
# Single source of truth for this bet's governance state. Read by skill
# 14-lifecycle-navigator on each session start. Populated by skill
# 00-repo-state-import on first deploy.
#
# Every claim-bearing field carries an `evidence:` tag from
# {fact, assumption, inference, open_question}. `evidence: fact` requires
# a non-null `source`. Untagged claims are confident fog; the import skill
# refuses to emit them. See SKILL_DESIGN_PATTERN.md#assumption-tagging.

schema_version: 1

bet:
  id: ""                                # kebab-case; unique within the repo
  name: ""                              # human-readable
  status: active                        # active | paused | wound_down
  prfaq_path: null                      # path to PRFAQ artifact, or null if none yet
  six_pager_paths: []                   # list of six-pager artifact paths
  origin: brownfield                    # greenfield | brownfield; install.sh sets brownfield by default
  bootstrapped_at: null                 # ISO-8601 timestamp set by 00-repo-state-import
  bootstrapped_by: null                 # operator handle set by 00-repo-state-import

tenets: []
  # Example shape:
  # - id: tenet-customer-first
  #   statement: "We will not ship a feature that increases short-term revenue at the cost of long-term customer trust."
  #   evidence: fact                    # fact | assumption | inference | open_question
  #   source: "docs/principles.md"      # required when evidence == fact

