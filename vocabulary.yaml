# vocabulary.yaml
# Canonical enums and labels used across the skills suite.
# When a skill references one of these, it links here instead of restating.
# Human-readable companion: GLOSSARY.md

assumption_tags:
  description: |
    Every empirical claim a skill emits should be tagged with one of these.
    Untagged claims are confident fog.
  values:
    - fact            # verifiable, with a source
    - assumption      # believed true, untested
    - inference       # derived from facts already established
    - open question   # listed in an explicit Open Questions section
  used_by:
    - all-skills
    - SKILL_DESIGN_PATTERN.md

variance_classifications:
  description: |
    Every negative variance in a Weekly Business Review must map to exactly one.
  values:
    - known cause
    - hypothesis
    - unknown
    - no action needed because…
    - action item created
  notes:
    - "'unknown' is acceptable for one week. Two weeks of 'unknown' on the same metric is a process failure and should trigger correction-of-errors on the inspection mechanism itself."
  used_by:
    - 05-weekly-business-review

metric_types:
  description: |
    Metrics in this suite are classified by what they measure.
  values:
    input_metric:
      definition: leading indicator the team controls
      example: number of customer interviews completed this week
    output_metric:
      definition: lagging indicator the customer experiences
      example: customer-reported time-to-status
  used_by:
    - 04-mechanism-designer
    - 05-weekly-business-review

decision_recommendations:
  description: |
    Terminal recommendation emitted by an authoring skill (PRFAQ, six-pager).
  values:
    - proceed
    - proceed_with_changes
    - do_not_proceed
    - needs_more_info
  used_by:
    - 01-working-backwards-prfaq
    - 03-six-page-narrative

principle_scores:
  description: |
    How each leadership principle is scored against a proposal under review.
  values:
    - strong          # cited evidence in the proposal
    - weak            # mentioned without evidence, or evidence runs counter
    - silent          # the proposal does not address this principle
    - contradictory   # the proposal invokes this principle to skip another
  used_by:
    - 07-leadership-principles-reviewer

severity_and_likelihood:
  description: |
    Risk severity and likelihood scales used by PRFAQ and six-page-narrative.
  status: open_question
  notes:
    - "Both authoring skills ask for severity + likelihood on each risk, but neither defines the scale. Pick one consistently within a document and document the choice. Adopt a shared scale in a follow-up."

evidence_type:
  description: |
    Customer evidence is classified by what kind of signal it provides.
    Attitudinal evidence predicts behavior at roughly 40-60% accuracy.
    PRFAQ-grade conclusions require behavioral corroboration.
  values:
    behavioral:
      definition: what respondents did, observable
      example: switched tools, paid for a workaround, opened a GitHub issue, churned
    attitudinal:
      definition: what respondents said they would do, self-reported
      example: stated preference, hypothetical willingness to pay, opinion in an interview
  used_by:
    - 08-customer-interview-synthesis

interview_artifact_type:
  description: |
    Source type for customer-interview-synthesis inputs. Transcripts and notes are
    not interchangeable; notes carry the interviewer's selection bias.
  values:
    transcript:
      definition: verbatim record of what was said
      weight: high
    structured_notes:
      definition: interviewer's filtered record
      weight: low
    survey_response:
      definition: structured survey data
      weight: medium
  used_by:
    - 08-customer-interview-synthesis

gate_decisions:
  description: |
    Gate decision emitted by launch-readiness-review.
  values:
    - go                       # all checks pass; launch
    - no_go                    # blocking drift, gaps, or risks; do not launch
    - conditional_go           # launch with named conditions, each with owner + gate_date
    - defer                    # work not done; ask again in N days
  notes:
    - "'conditional_go' has historically rotted into soft 'go'. Conditions must themselves be gated; a condition that says 'we'll fix this post-launch' makes the decision 'go-with-risk', not 'conditional_go'."
    - "'defer' is distinct from 'no_go': defer says 'not yet, ask later'; no_go says 'this should not ship as built'."
  used_by:
    - 09-launch-readiness-review

prfaq_drift_severity:
  description: |
    How significant a drift between PRFAQ promise and current build state is.
  values:
    - blocking                 # commitment not met; cannot ship
    - significant              # measurably different from promised; must be acknowledged in launch narrative
    - acceptable               # within tolerance; documented but does not block
  used_by:
    - 09-launch-readiness-review

risk_status:
  description: |
    How a risk from the PRFAQ risk register has evolved by launch time.
  values:
    - mitigated                # the documented mitigation worked
    - open                     # the risk still exists; mitigation unproven
    - materialized             # the risk happened during build; document the outcome
  used_by:
    - 09-launch-readiness-review

tenet_status:
  description: |
    Validity of a product tenet at review time.
  values:
    - valid                    # external evidence still supports it
    - invalid                  # external evidence contradicts it; thesis broken
    - unknown                  # insufficient evidence to judge
  notes:
    - "A tenet status check must cite external context (market shifts, competitor moves, regulatory changes), not just metrics. See the 'metric satisficing' failure mode in tenets-review."
  used_by:
    - 10-tenets-review

bet_recommendations:
  description: |
    Recommendation emitted by tenets-review.
  values:
    - continue                 # all tenets valid (or unknown with active monitoring); keep investing
    - kill                     # one or more tenets invalid; stop investing
    - pivot                    # tenets need restatement; thesis has evolved
    - escalate                 # decision is above this review's pay grade
  notes:
    - "'continue' requires no tenet to be 'invalid'. A single invalid tenet forces kill/pivot/escalate."
  used_by:
    - 10-tenets-review

calibration_assessment:
  description: |
    Per-goal calibration assessment emitted by ambitious-goal-grading. Distinct
    from outcome quality (tenets-review) and execution quality (correction-of-errors).
    The question is whether the target was set at the right difficulty level,
    regardless of whether it was hit.
  values:
    sandbagged:                # hit at attainment_score >= 1.0 with no surprise evidence
      definition: target was set deliberately or implicitly below honest capacity
    well_calibrated:           # attainment_score in [0.3, 1.0] with honest plan or surprise evidence
      definition: target was set at a level that taught the team something
    overreach:                 # attainment_score < 0.5 with no honest plan; not an execution failure
      definition: target was set beyond any plan that could have hit it
    unknowable:                # goal_setting_context == "unstated"
      definition: difficulty intent was never declared; calibration cannot be assessed
    goalpost_moving:           # mid_period_target_changes present and not disclosed
      definition: target moved mid-period and grading reported only the revised target
  used_by:
    - 11-ambitious-goal-grading

attainment_score:
  description: |
    Continuous score (0.0–1.5) representing what fraction of a target was achieved.
    0.7 is the honest-calibration norm, borrowed from OKR convention. 1.0 is
    suspect until paired with surprise_evidence. Over-attainment past 1.5 is itself
    a calibration signal, not a credential.
  format: continuous_0_to_1_5
  notes:
    - "Numeric goals: actual / target, clamped to [0.0, 1.5]."
    - "Qualitative goals: rubric {met, partially_met, not_met} maps to {1.0, 0.5, 0.0} for pattern math."
  used_by:
    - 11-ambitious-goal-grading

pattern_assessment:
  description: |
    Cross-period calibration pattern emitted by ambitious-goal-grading when
    prior_period_gradings are supplied. Threshold is three consecutive periods
    of the same per-period assessment on the same recurring goal.
  values:
    - chronic_sandbagging         # triggers tenet_violation_candidate
    - chronic_overreach           # routes to six-page-narrative on capacity or tenets-review
    - well_calibrated             # baseline state
    - mixed                       # no clean pattern across periods
    - insufficient_data           # prior_period_gradings absent
  used_by:
    - 11-ambitious-goal-grading

goal_setting_context:
  description: |
    The team's stated difficulty intent for a goal at authoring time. Required
    for honest calibration assessment after the fact; without it, every outcome
    can be retroactively framed as success.
  values:
    - committed                   # the team intended to hit this
    - stretch                     # the team intended to push for this, ~0.7 attainment honest
    - aspirational                # the team intended this as a direction marker, not a target
    - unstated                    # no intent declared; itself a finding
  used_by:
    - 11-ambitious-goal-grading

required_reviews:
  description: |
    Convention: authoring skills declare a `required_reviews` field in their
    frontmatter listing reviewer skills that must run before the artifact is
    considered complete. Reviewer skills do not declare this field.
  rationale: |
    Reviewer cadence is the suite's leverage. An optional reviewer becomes
    decorative. Codifying required reviews per authoring skill converts the soft
    promise "if a reviewer is available, hand it the prose" into a contract.
  used_by:
    - SKILL_DESIGN_PATTERN.md
    - all authoring skills
